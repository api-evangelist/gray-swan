aid: gray-swan
name: Gray Swan
description: >-
  Gray Swan AI is an AI security company that helps enterprises deploy AI with
  confidence. Its Cygnal product is a real-time, drop-in secure proxy that
  fronts LLM providers (OpenAI, Anthropic, and Gemini request formats) with
  input/output filtering and threat monitoring for jailbreaks and prompt
  injection, governed by versioned enforcement Policies managed over a REST API.
  Gray Swan also operates Shade (an adversarial red-teaming platform), Arena (a
  global adversarial red-teaming network), and adversarial model evaluations
  that frontier AI labs run before shipping. The company is SOC 2 Type 2 and
  Cyber Essentials certified.
